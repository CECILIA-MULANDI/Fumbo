<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fumbo · X cover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Exact tokens from packages/frontend/app/globals.css (dark mode) */
      :root {
        --bg: oklch(0.18 0.014 190);
        --fg: oklch(0.96 0.005 90);
        --muted: oklch(0.72 0.018 195);
        --accent: oklch(0.67 0.055 195);
        --border: oklch(0.30 0.014 190);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        background: var(--bg);
      }
      body {
        font-family: "Geist", ui-sans-serif, system-ui, sans-serif;
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      .cover {
        width: 1600px;
        height: 900px;
        position: relative;
        background: var(--bg);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
      }
      /* barely-there grid */
      .cover::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(var(--border) 1px, transparent 1px),
          linear-gradient(90deg, var(--border) 1px, transparent 1px);
        background-size: 80px 80px;
        opacity: 0.6;
        pointer-events: none;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 40px;
        z-index: 1;
      }
      .mark {
        width: 160px;
        height: 160px;
      }
      .wordmark {
        font-size: 200px;
        font-weight: 600;
        letter-spacing: -0.035em;
        color: var(--fg);
        line-height: 1;
      }
      .eyebrow {
        z-index: 1;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 18px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="cover">
      <div class="brand">
        <svg
          class="mark"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
        >
          <circle
            cx="12"
            cy="12"
            r="10"
            fill="none"
            stroke="#5FA8A8"
            stroke-width="1.5"
          />
          <path
            d="M12 6 L12 18 M6 12 L18 12"
            stroke="#5FA8A8"
            stroke-width="1.5"
            stroke-linecap="round"
            opacity="0.4"
          />
          <circle cx="12" cy="12" r="3" fill="#5FA8A8" />
        </svg>
        <div class="wordmark">Fumbo</div>
      </div>
      <div class="eyebrow">Confidential prize savings</div>
    </div>
  </body>
</html>
